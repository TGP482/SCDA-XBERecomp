<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6e75"/>
      <stop offset="0.45" stop-color="#383b40"/>
      <stop offset="1" stop-color="#1a1b1e"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4d7dc"/>
      <stop offset="1" stop-color="#4a4d53"/>
    </linearGradient>
  </defs>
  <!-- the DualShock 2's flat SELECT button, its name under it -->
  <rect x="1.4" y="5.4" width="29.2" height="21.2" rx="6" fill="#0b0b0c"/>
  <rect x="2.1" y="6.1" width="27.8" height="19.8" rx="5.4" fill="url(#body)" stroke="url(#rim)" stroke-width="0.9"/>
  <rect x="9.5" y="9.4" width="13" height="4.4" rx="1.2" fill="#d9dce0" stroke="#000" stroke-opacity="0.6"
        stroke-width="0.8"/>
  <text x="16" y="22.6" font-family="'Arial Narrow', Arial, sans-serif" font-weight="bold" font-size="7.4"
        text-anchor="middle" fill="#000" fill-opacity="0.6" stroke="#000" stroke-opacity="0.6"
        stroke-width="1.2">SELECT</text>
  <text x="16" y="22.6" font-family="'Arial Narrow', Arial, sans-serif" font-weight="bold" font-size="7.4"
        text-anchor="middle" fill="#f2f3f5">SELECT</text>
</svg>
