<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- night vision goggles: three lenses glowing the HUD's green over a dark plate -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9ff9e"/>
      <stop offset="0.35" stop-color="#8fd34a"/>
      <stop offset="1" stop-color="#2c4a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c211a"/>
      <stop offset="1" stop-color="#0a0b0a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="40" fill="url(#plate)" stroke="#919e82" stroke-opacity="0.6" stroke-width="4"/>
  <g fill="#0c0e0b" stroke="#5f6a54" stroke-width="5">
    <circle cx="128" cy="96" r="38"/>
    <circle cx="80" cy="150" r="30"/>
    <circle cx="176" cy="150" r="30"/>
  </g>
  <circle cx="128" cy="96" r="26" fill="url(#glow)"/>
  <circle cx="80" cy="150" r="20" fill="url(#glow)"/>
  <circle cx="176" cy="150" r="20" fill="url(#glow)"/>
  <text x="128" y="222" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="#c8d2b8">SC DA</text>
</svg>
